spring.application.name=gym-management-api
spring.profiles.default=dev
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
gym.jwt.secret=${GYM_JWT_SECRET}
gym.jwt.expiration-ms=${GYM_JWT_EXPIRATION_MS:43200000}
gym.demo-data.enabled=false
gym.cors.allowed-origin=${GYM_CORS_ORIGIN:http://localhost:4200}
gym.business-zone=Asia/Kolkata
gym.tax.cgst-rate=${GYM_TAX_CGST_RATE:9.00}
gym.tax.sgst-rate=${GYM_TAX_SGST_RATE:9.00}
gym.tax.igst-rate=${GYM_TAX_IGST_RATE:18.00}
gym.tax.interstate=${GYM_TAX_INTERSTATE:false}
gym.reminders.cron=${GYM_RENEWAL_REMINDERS_CRON:0 */15 * * * *}
gym.owner-setup.key=${GYM_OWNER_SETUP_KEY:}
gym.mail.from=${MAIL_FROM:noreply@gym.local}
gym.platform.billing-email=${GYM_PLATFORM_BILLING_EMAIL:billing@gymflow.io}
gym.platform.admin-email=${GYM_PLATFORM_ADMIN_EMAIL:admin@gymflow.io}
gym.app.url=${GYM_APP_URL:http://localhost:4200}
gym.auth.cookie-secure=${GYM_COOKIE_SECURE:false}
gym.password-reset.expose-code=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}